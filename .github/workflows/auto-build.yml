name: Auto-Build Latest Upstream Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: "ghcr.io/${{ github.repository }}"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read     
      packages: write    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Check if image needs building
        id: check
        run: |
          UPSTREAM_REPO="deltachat/deltachat-desktop"
          
          # 1. Fetch the API response using the GitHub token to prevent rate-limiting
          API_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest")
          
          # 2. Extract the tag
          LATEST_TAG=$(echo "$API_RESPONSE" | jq -r .tag_name)
          
          # 3. Fail gracefully if the tag is null or empty
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error: Could not fetch the latest tag. API Response was:"
            echo "$API_RESPONSE"
            exit 1
          fi
          
          echo "Latest upstream tag is: $LATEST_TAG"
          
          if docker manifest inspect ${{ env.IMAGE_NAME }}:$LATEST_TAG > /dev/null 2>&1; then
            echo "Image for $LATEST_TAG already exists in GHCR. Skipping build!"
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "Image for $LATEST_TAG not found! We need to build it."
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.build_needed == 'true' 
        uses: docker/setup-buildx-action@v4

      - name: Build and Push new image
        if: steps.check.outputs.build_needed == 'true' 
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DELTACHAT_VERSION=${{ steps.check.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.check.outputs.version }}
